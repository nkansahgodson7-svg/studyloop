<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F5F1E8" />
  <meta name="description" content="StudyLoop — turn your notes into answers, flashcards, and a daily review loop." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2314563E'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23F5F1E8' stroke-width='2.5'/%3E%3C/svg%3E" />
  <title>StudyLoop — AI study loops</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;450;500;550;600;650&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="frame" aria-hidden="true"></div>

  <div class="shell" id="shell">
    <main class="view" id="view"></main>

    <nav class="tabbar" id="tabbar" aria-label="Primary">
      <button class="tabbar__item" type="button" data-nav="#/home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg>
        <span>Today</span>
      </button>
      <button class="tabbar__item" type="button" data-nav="#/review">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="6.5" width="12" height="15" rx="2.5"/><path d="M8.5 3.5h9A2.5 2.5 0 0 1 20 6v11"/></svg>
        <span>Review</span>
      </button>
      <button class="tabbar__item" type="button" data-nav="#/library">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H14a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h6z"/></svg>
        <span>Library</span>
      </button>
      <button class="tabbar__item" type="button" data-nav="#/settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.64 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.09a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg>
        <span>Settings</span>
      </button>
    </nav>

    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
    <div class="sheet-root" id="sheetRoot"></div>
  </div>

  <noscript>
    <p style="padding: 24px; font-family: system-ui, sans-serif">
      StudyLoop needs JavaScript for the interactive mockup.
    </p>
  </noscript>

  <script src="icons.js"></script>
  <script src="data.js"></script>
  <script src="screens.js"></script>
  <script src="session.js"></script>
  <script src="sheets.js"></script>
  <script src="app.js"></script>
</body>
</html>
