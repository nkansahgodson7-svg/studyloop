<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F1E8" />
    <title>Offline — StudyLoop</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f5f1e8;
        --ink: #15160f;
        --muted: #6e6b5d;
        --brand: #14563e;
        --brand-2: #0b3527;
        --line: #e3dccc;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--paper);
        color: var(--ink);
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      main {
        max-width: 340px;
        display: grid;
        gap: 12px;
        justify-items: center;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
      }
      h1 {
        margin: 8px 0 0;
        font-family: Fraunces, Georgia, "Times New Roman", serif;
        font-size: 28px;
        font-weight: 500;
        letter-spacing: -0.02em;
      }
      h1 em {
        color: var(--brand);
        font-style: italic;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.55;
      }
      button {
        margin-top: 10px;
        min-height: 44px;
        padding: 0 22px;
        border: 0;
        border-radius: 999px;
        background: var(--brand);
        color: #fffdf8;
        font: inherit;
        font-weight: 550;
        cursor: pointer;
      }
      button:active {
        background: var(--brand-2);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="72" height="72" />
      <h1>Study<em>Loop</em></h1>
      <p>You're offline. Reconnect to sync your notebooks and keep the loop going.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
